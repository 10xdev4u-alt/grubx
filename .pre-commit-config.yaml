repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: local
    hooks:
    -   id: validate-themes
        name: Validate PrinceTheme Variants
        entry: python3 sdk/cli.py check
        language: system
        files: \.txt$
